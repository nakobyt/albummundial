<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum Panini Mundial 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap');

:root {
  --verde: #00c853;
  --rojo: #ff1744;
  --azul: #0d47a1;
  --fondo: #0a0a12;
  --card: #12121e;
  --borde: #1e1e2e;
  --texto: #e8e8f0;
  --gris: #4a4a6a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--fondo);
  color: var(--texto);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #0a2a6e 100%);
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.trophy { font-size: 28px; }

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  line-height: 1;
}

h1 span { color: #ffd600; }

.stats-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.stat {
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 8px;
  text-align: center;
}

.stat-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  line-height: 1;
}

.stat-num.tengo { color: #00e676; }
.stat-num.faltan { color: #ff6b6b; }
.stat-num.total { color: #ffd600; }

.stat-label { font-size: 9px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  margin-top: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00c853, #69f0ae);
  border-radius: 3px;
  transition: width 0.4s ease;
}

.controles {
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  background: #0e0e1a;
  border-bottom: 1px solid var(--borde);
  flex-wrap: wrap;
}

.filtro-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--borde);
  background: transparent;
  color: var(--texto);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}

.filtro-btn.activo {
  background: var(--azul);
  border-color: var(--azul);
  color: white;
}

.filtro-btn:hover { opacity: 0.8; }

.buscar {
  flex: 1;
  min-width: 120px;
  padding: 6px 12px;
  background: var(--card);
  border: 1px solid var(--borde);
  border-radius: 20px;
  color: var(--texto);
  font-size: 12px;
  font-family: 'Inter', sans-serif;
}

.buscar:focus { outline: none; border-color: var(--azul); }

.equipos-wrapper {
  padding: 12px 16px;
}

.equipo-section {
  margin-bottom: 16px;
}

.equipo-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: var(--card);
  border-radius: 10px 10px 0 0;
  border: 1px solid var(--borde);
  cursor: pointer;
  user-select: none;
}

.equipo-nombre {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.equipo-mini-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}

.equipo-progreso {
  font-size: 11px;
  color: var(--gris);
}

.equipo-completo { color: var(--verde) !important; }

.stickers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 6px;
  padding: 10px;
  background: #0e0e1a;
  border: 1px solid var(--borde);
  border-top: none;
  border-radius: 0 0 10px 10px;
}

.sticker {
  background: var(--card);
  border: 1.5px solid var(--borde);
  border-radius: 8px;
  padding: 6px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}

.sticker:hover { transform: scale(1.05); border-color: var(--gris); }

.sticker.tengo {
  background: rgba(0, 200, 83, 0.15);
  border-color: var(--verde);
}

.sticker.foil {
  background: linear-gradient(135deg, rgba(255,214,0,0.08), rgba(255,100,0,0.08));
  border-color: #ffd600;
}

.sticker.foil.tengo {
  background: linear-gradient(135deg, rgba(255,214,0,0.25), rgba(0,200,83,0.2));
  border-color: #ffd600;
}

.sticker-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  color: var(--gris);
  line-height: 1;
}

.sticker.tengo .sticker-num { color: var(--verde); }
.sticker.foil .sticker-num { color: #ffd600; }

.sticker-nom {
  font-size: 8px;
  color: var(--gris);
  margin-top: 2px;
  line-height: 1.2;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.sticker.tengo .sticker-nom { color: #a5d6a7; }

.check-icon {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 14px;
  height: 14px;
  background: var(--verde);
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: white;
}

.sticker.tengo .check-icon { display: flex; }

.btn-reset {
  position: fixed;
  bottom: 20px;
  right: 16px;
  background: var(--rojo);
  color: white;
  border: none;
  border-radius: 50px;
  padding: 10px 16px;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  box-shadow: 0 4px 15px rgba(255,23,68,0.4);
  z-index: 50;
}

.btn-reset:hover { opacity: 0.9; }

.empty-msg {
  text-align: center;
  padding: 40px;
  color: var(--gris);
  font-size: 14px;
}

.collapse-icon { transition: transform 0.2s; font-size: 12px; }
.collapsed .collapse-icon { transform: rotate(-90deg); }
.collapsed .stickers-grid { display: none; }

.mini-prog {
  width: 50px;
  height: 4px;
  background: var(--borde);
  border-radius: 2px;
  overflow: hidden;
}
.mini-prog-fill {
  height: 100%;
  background: var(--verde);
  border-radius: 2px;
  transition: width 0.3s;
}
</style>
</head>

<header>
  <div class="header-top">
    <span class="trophy">🏆</span>
    <div>

const TOTAL = STICKERS.length;
let tengo = JSON.parse(localStorage.getItem('panini2026') || '{}');
let filtro = 'todos';
let busqueda = '';

function guardar() {
  localStorage.setItem('panini2026', JSON.stringify(tengo));
}

function toggleSticker(id) {
  tengo[id] = !tengo[id];
  if (!tengo[id]) delete tengo[id];
  guardar();
  actualizarStats();
  actualizarSticker(id);
  actualizarEquipo(id);
}

function actualizarStats() {
  const cnt = Object.values(tengo).filter(Boolean).length;
  document.getElementById('cntTengo').textContent = cnt;
  document.getElementById('cntFaltan').textContent = TOTAL - cnt;
  const pct = (cnt / TOTAL * 100).toFixed(1);
  document.getElementById('progFill').style.width = pct + '%';
}

function actualizarSticker(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  if (tengo[id]) { el.classList.add('tengo'); }
  else { el.classList.remove('tengo'); }
  if (filtro !== 'todos') renderAll();
}

function actualizarEquipo(id) {
  const s = STICKERS.find(x => x.id === id);
  if (!s) return;
  const eq = s.eq;
  const eqStickers = STICKERS.filter(x => x.eq === eq);
  const cnt = eqStickers.filter(x => tengo[x.id]).length;
  const total = eqStickers.length;
  const sec = document.querySelector(`[data-eq="${eq}"]`);
  if (!sec) return;
  const prog = sec.querySelector('.equipo-progreso');
  const miniBar = sec.querySelector('.mini-prog-fill');
  const isComp = cnt === total;
  prog.textContent = `${cnt}/${total}`;
  prog.classList.toggle('equipo-completo', isComp);
  miniBar.style.width = (cnt/total*100) + '%';
}

function equipos() {
  const map = {};
  STICKERS.forEach(s => {
    if (!map[s.eq]) map[s.eq] = [];
    map[s.eq].push(s);
  });
  return map;
}

function renderAll() {
  const wrapper = document.getElementById('equiposWrapper');
  const eqMap = equipos();
  const busq = busqueda.toLowerCase();

  const equiposFiltrados = Object.entries(eqMap).filter(([eq, stickers]) => {
    if (busq) {
      return eq.toLowerCase().includes(busq) || stickers.some(s => s.nom.toLowerCase().includes(busq) || s.id.toLowerCase().includes(busq));
    }
    if (filtro === 'tengo') return stickers.some(s => tengo[s.id]);
    if (filtro === 'faltan') return stickers.some(s => !tengo[s.id]);
    return true;
  });

  if (equiposFiltrados.length === 0) {
    wrapper.innerHTML = '<div class="empty-msg">No se encontraron figuritas 🔍</div>';
    return;
  }

  wrapper.innerHTML = equiposFiltrados.map(([eq, stickers]) => {
    let visibles = stickers;
    if (busq) {
      visibles = stickers.filter(s => s.nom.toLowerCase().includes(busq) || s.id.toLowerCase().includes(busq) || eq.toLowerCase().includes(busq));
    } else if (filtro === 'tengo') {
      visibles = stickers.filter(s => tengo[s.id]);
    } else if (filtro === 'faltan') {
      visibles = stickers.filter(s => !tengo[s.id]);
    }

    if (visibles.length === 0) return '';

    const cnt = stickers.filter(s => tengo[s.id]).length;
    const total = stickers.length;
    const isComp = cnt === total;
    const pct = cnt/total*100;

    return `
      <div class="equipo-section">
        <div class="equipo-header" onclick="toggleEq(this)" data-eq="${eq}">
          <div class="equipo-nombre">
            ${isComp ? '✅ ' : ''}${eq}
          </div>
          <div class="equipo-mini-bar">
            <div class="mini-prog"><div class="mini-prog-fill" style="width:${pct}%"></div></div>
            <span class="equipo-progreso ${isComp ? 'equipo-completo' : ''}">${cnt}/${total}</span>
            <span class="collapse-icon">▼</span>
          </div>
        </div>
        <div class="stickers-grid">
          ${visibles.map(s => `
            <div class="sticker ${s.foil ? 'foil' : ''} ${tengo[s.id] ? 'tengo' : ''}" data-id="${s.id}" onclick="toggleSticker('${s.id}')">
              <div class="check-icon">✓</div>
              <div class="sticker-num">${s.id}</div>
              <div class="sticker-nom">${s.nom}${s.foil ? ' ✨' : ''}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleEq(header) {
  header.parentElement.classList.toggle('collapsed');
}

function setFiltro(f, btn) {
  filtro = f;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
  btn.classList.add('activo');
  renderAll();
}

function resetear() {
  if (confirm('¿Resetear toda la colección? Se borrarán todas las figuritas marcadas.')) {
    tengo = {};
    guardar();
    actualizarStats();
    renderAll();
  }
}

document.getElementById('buscar').addEventListener('input', e => {
  busqueda = e.target.value;
  renderAll();
});

actualizarStats();
renderAll();
</script>
